<!doctype html><html lang="ko"><head><link rel="icon" href="data:,"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFTER HOURS · Maple</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#101a28;color:#eaf2f7;font-family:system-ui,sans-serif;overflow:hidden}#wrap{width:100%;height:100%;display:grid;place-items:center}#unity-canvas{width:min(100vw,177.7778vh);height:min(56.25vw,100vh);background:#142030;outline:0}#load{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:420px}progress{width:100%;height:12px}small{display:block;color:#9cb0c2;margin-top:20px}#error{white-space:pre-wrap;color:#ffacac}#open{padding:14px 36px;background:#e9bc70;color:#1c2431;border:0;font-size:18px;cursor:pointer}</style></head><body><div id="wrap"><canvas id="unity-canvas" width="1280" height="720" tabindex="0"></canvas></div><div id="load"><h1>AFTER HOURS</h1><p>메이플의 같은 자리, 새로운 이야기</p><button id="open">시작하기</button><progress value="0" max="1" hidden></progress><small id="state">빅뱅 이전 v83 원본 맵 · 성인 팬게임</small><div id="error"></div></div><script src="Build/{{{ LOADER_FILENAME }}}"></script><script>
